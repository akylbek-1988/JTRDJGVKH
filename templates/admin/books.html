{% extends 'admin/admin_base.html' %}
{% block admin_content %}
<h2>Books</h2>
<div class="admin-form-card">
    <h3>Add book</h3>
    <form method="POST" enctype="multipart/form-data" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
        <label>Title</label>
        <input type="text" name="title" required />
        <label>Author</label>
        <input type="text" name="author" required />
        <label>Category</label>
        <input type="text" name="category" required />
        <label>Description</label>
        <textarea name="description" rows="4"></textarea>
        <label>Cover image</label>
        <input type="file" name="cover" accept="image/*" />
        <label>PDF file</label>
        <input type="file" name="pdf" accept="application/pdf" required />
        <button type="submit" class="button button-primary">Add Book</button>
    </form>
</div>
<table class="admin-table">
    <thead><tr><th>ID</th><th>Title</th><th>Author</th><th>Category</th><th>Action</th></tr></thead>
    <tbody>
        {% for book in books %}
        <tr>
            <td>{{ book.id }}</td>
            <td>{{ book.title }}</td>
            <td>{{ book.author }}</td>
            <td>{{ book.category }}</td>
            <td><a href="?delete={{ book.id }}" class="button button-secondary">Delete</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
