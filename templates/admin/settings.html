{% extends 'admin/admin_base.html' %}
{% block admin_content %}
<h2>Settings</h2>
<form method="POST" novalidate class="admin-form-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <label>Site title</label>
    <input type="text" name="site_title" value="{{ settings.site_title }}" required />
    <label>Tagline</label>
    <input type="text" name="tagline" value="{{ settings.tagline }}" required />
    <label>Phone</label>
    <input type="text" name="phone" value="{{ settings.phone }}" required />
    <label>Email</label>
    <input type="email" name="email" value="{{ settings.email }}" required />
    <label>Address</label>
    <input type="text" name="address" value="{{ settings.address }}" required />
    <label>Students</label>
    <input type="number" name="students" value="{{ statistics.students }}" required />
    <label>Teachers</label>
    <input type="number" name="teachers" value="{{ statistics.teachers }}" required />
    <label>Graduates</label>
    <input type="number" name="graduates" value="{{ statistics.graduates }}" required />
    <label>Programs</label>
    <input type="number" name="programs" value="{{ statistics.programs }}" required />
    <button type="submit" class="button button-primary">Save Settings</button>
</form>
{% endblock %}
