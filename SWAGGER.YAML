swagger: '2.0'
info:
  title: Education Website API
  description: API documentation for the education website.
  version: '1.0.0'
host: 127.0.0.1:5000
basePath: /
schemes:
  - http
paths:
  /:
    get:
      summary: Open the home page
      description: Returns the website home page as HTML.
      produces:
        - text/html
      responses:
        '200':
          description: Home page returned successfully.
          schema:
            type: string
        '500':
          description: Internal server error.
